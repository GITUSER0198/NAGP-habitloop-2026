name: habitloop

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-environment: &service-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set and nonempty in .env}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set and nonempty in .env}
  EVENT_BUS_MODE: ${EVENT_BUS_MODE:-local}
  EVENT_BUS_NAME: ${EVENT_BUS_NAME:-default}
  EVENT_WORKER_URL: http://event-worker:8000/events
  DYNAMODB_TABLE: ${DYNAMODB_TABLE:-habitloop-analytics}
  DYNAMODB_ENDPOINT: http://dynamodb-local:8000
  AWS_REGION: ${AWS_REGION:-ap-south-1}
  # DynamoDB Local accepts these dummy credentials. AWS uses task-role credentials.
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  USER_SERVICE_URL: http://user-service:8000
  ACTIVITY_SERVICE_URL: http://activity-service:8000
  CHALLENGE_SERVICE_URL: http://challenge-service:8000
  INTEGRATION_SERVICE_URL: http://integration-service:8000
  ANALYTICS_SERVICE_URL: http://analytics-service:8000
  RECOMMENDATION_SERVICE_URL: http://recommendation-service:8000
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  WEB_PORT: ${WEB_PORT:?Set WEB_PORT in .env}

x-service: &service
  init: true
  depends_on:
    postgres:
      condition: service_healthy
    dynamodb-init:
      condition: service_completed_successfully
    event-worker:
      condition: service_healthy
  logging: *bounded-logging

services:
  postgres:
    image: postgres:16-alpine
    logging: *bounded-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    logging: *bounded-logging
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    working_dir: /home/dynamodblocal
    volumes:
      - ./data/dynamodb:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  dynamodb-init:
    image: amazon/aws-cli:latest
    logging: *bounded-logging
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
      AWS_PAGER: ""
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-habitloop-analytics}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempt=1
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null; do
          if [ "$$attempt" -ge 10 ]; then
            echo "DynamoDB did not become ready after $$attempt attempts" >&2
            exit 1
          fi
          echo "Waiting for DynamoDB: attempt $$attempt of 10"
          attempt=$$((attempt + 1))
          sleep 2
        done
        if ! aws dynamodb describe-table --table-name "$$DYNAMODB_TABLE" --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; then
          aws dynamodb create-table --table-name "$$DYNAMODB_TABLE" \
            --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S \
            --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb-local:8000
        fi
        aws dynamodb wait table-exists --table-name "$$DYNAMODB_TABLE" --endpoint-url http://dynamodb-local:8000
        echo "DynamoDB table ready: $$DYNAMODB_TABLE"

  event-worker:
    init: true
    build:
      context: .
      dockerfile: tools/event-worker/Dockerfile
    environment:
      <<: *service-environment
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    logging: *bounded-logging

  user-service:
    <<: *service
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      <<: *service-environment
      DB_SCHEMA: users

  activity-service:
    <<: *service
    build:
      context: .
      dockerfile: services/activity-service/Dockerfile
    environment:
      <<: *service-environment
      DB_SCHEMA: activities

  challenge-service:
    <<: *service
    build:
      context: .
      dockerfile: services/challenge-service/Dockerfile
    environment:
      <<: *service-environment
      DB_SCHEMA: challenges

  integration-service:
    <<: *service
    build:
      context: .
      dockerfile: services/integration-service/Dockerfile
    environment:
      <<: *service-environment
      DB_SCHEMA: integrations

  analytics-service:
    <<: *service
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    environment:
      <<: *service-environment
      DB_SCHEMA: analytics

  recommendation-service:
    <<: *service
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
    environment:
      <<: *service-environment
      DB_SCHEMA: recommendations

  gateway:
    image: nginx:stable-alpine
    logging: *bounded-logging
    ports:
      - "${GATEWAY_PORT:?Set GATEWAY_PORT in .env}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      activity-service:
        condition: service_healthy
      challenge-service:
        condition: service_healthy
      integration-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
