events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format request_json escape=json
        '{"service":"gateway","request_id":"$request_id",'
        '"tenant_id":null,"method":"$request_method","path":"$uri","status":$status}';
    access_log /dev/stdout request_json;
    error_log /dev/stderr warn;

    server {
        listen 80;
        server_tokens off;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Variables defer service DNS lookups until requests are proxied.
        set $service_port 47820;
        set $user_upstream user-service:$service_port;
        set $activity_upstream activity-service:$service_port;
        set $challenge_upstream challenge-service:$service_port;
        set $integration_upstream integration-service:$service_port;
        set $analytics_upstream analytics-service:$service_port;
        set $recommendation_upstream recommendation-service:$service_port;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # Regex locations are evaluated before the service prefix locations.
        location ~* ^/api/[^/]+/internal(?:/|$) {
            return 404;
        }

        # Task 13: ALB rules must match both /api/<svc> and /api/<svc>/*,
        # preserve the path, and block internal routes before forwarding.
        location = /api/users { proxy_pass http://$user_upstream; }
        location /api/users/ { proxy_pass http://$user_upstream; }
        location = /api/activities { proxy_pass http://$activity_upstream; }
        location /api/activities/ { proxy_pass http://$activity_upstream; }
        location = /api/challenges { proxy_pass http://$challenge_upstream; }
        location /api/challenges/ { proxy_pass http://$challenge_upstream; }
        location = /api/integrations { proxy_pass http://$integration_upstream; }
        location /api/integrations/ { proxy_pass http://$integration_upstream; }
        location = /api/analytics/stream {
            proxy_pass http://$analytics_upstream;
            proxy_buffering off;
        }
        location = /api/analytics { proxy_pass http://$analytics_upstream; }
        location /api/analytics/ { proxy_pass http://$analytics_upstream; }
        location = /api/recommendations { proxy_pass http://$recommendation_upstream; }
        location /api/recommendations/ { proxy_pass http://$recommendation_upstream; }
        location / { return 404; }
    }
}
