events {}

http {
    log_format request_json escape=json
        '{"service":"gateway","request_id":"$request_id",'
        '"tenant_id":null,"method":"$request_method","path":"$uri","status":$status}';
    access_log /dev/stdout request_json;
    error_log /dev/stderr warn;

    server {
        listen 80;
        server_tokens off;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # Regex locations are evaluated before the service prefix locations.
        location ~* ^/api/[^/]+/internal(?:/|$) {
            return 404;
        }

        location /api/users/ { proxy_pass http://user-service:8000; }
        location /api/activities/ { proxy_pass http://activity-service:8000; }
        location /api/challenges/ { proxy_pass http://challenge-service:8000; }
        location /api/integrations/ { proxy_pass http://integration-service:8000; }
        location /api/analytics/ { proxy_pass http://analytics-service:8000; }
        location /api/recommendations/ { proxy_pass http://recommendation-service:8000; }
        location / { return 404; }
    }
}
